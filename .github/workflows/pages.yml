name: Deploy to GitHub Pages

# The site is plain static files, so there is nothing to build — this just
# publishes the repo root. `enablement: true` turns Pages on the first time
# this runs, so the site does not need to be switched on by hand.

on:
  push:
    branches: [claude/fantasy-draft-tool-icg1q5]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # Browsers hold on to assets/*.css and *.js hard. Stamping the commit SHA
      # into their URLs means a push is actually visible without a manual
      # cache clear on every device.
      - name: Cache-bust asset URLs
        run: sed -i "s/BUILDVER/${GITHUB_SHA::8}/g" index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
